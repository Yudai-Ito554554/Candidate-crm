name: Desktop QA artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Unsigned QA build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            apple_signing_identity: "-"
            artifact_name: candidate-crm-macos-unsigned
          - platform: Windows
            os: windows-latest
            apple_signing_identity: ""
            artifact_name: candidate-crm-windows-unsigned

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Verify build environment without printing secrets
        shell: bash
        run: |
          node -e "if (!process.env.VITE_SUPABASE_URL || !process.env.VITE_SUPABASE_PUBLISHABLE_KEY) { process.stderr.write('Required Supabase build secrets are not configured.\n'); process.exit(1); }"

      - name: Verify repository
        run: npm run verify:repo

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build desktop installers
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
        run: npm run tauri build

      - name: Verify ad-hoc signed macOS bundles
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          app_path="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          dmg_path="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"

          test -n "$app_path"
          test -n "$dmg_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

          mount_path="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_path" -quiet || true
            rmdir "$mount_path" || true
          }
          trap cleanup EXIT

          hdiutil attach "$dmg_path" -mountpoint "$mount_path" -nobrowse -readonly -quiet
          dmg_app_path="$(find "$mount_path" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$dmg_app_path"
          codesign --verify --deep --strict --verbose=2 "$dmg_app_path"

      - name: Generate artifact manifest
        run: npm run artifacts:manifest

      - name: Stage concise QA package
        shell: bash
        run: |
          set -euo pipefail

          package_path="artifacts/qa-package"
          mkdir -p "$package_path"
          cp artifacts/sha256-manifest.json "$package_path/"

          if [[ "${{ matrix.platform }}" == "macOS" ]]; then
            find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -exec cp {} "$package_path/" \;
            cat > "$package_path/INSTALL.txt" <<'EOF'
          Candidate CRM macOS 社内QA版

          1. DMGを開き、Candidate CRMをApplicationsへドラッグします。
          2. DMGを閉じ、Finderの「アプリケーション」からCandidate CRMを開きます。
          3. この成果物はApple公証前の社内QA専用品です。macOSが起動を拒否する場合は、
             システム設定 > プライバシーとセキュリティ から許可してください。

          「壊れている」「マルウェアが含まれていないことを検証できない」と表示される環境では、
          Developer ID署名・Apple公証済みの正式配布版が必要です。一般利用者へ配布しないでください。
          EOF
          else
            find src-tauri/target/release/bundle/msi -maxdepth 1 -name '*.msi' -exec cp {} "$package_path/" \;
            find src-tauri/target/release/bundle/nsis -maxdepth 1 -name '*-setup.exe' -exec cp {} "$package_path/" \;
            cat > "$package_path/INSTALL.txt" <<'EOF'
          Candidate CRM Windows 社内QA版

          MSIまたはsetup.exeを実行してインストールします。
          この成果物はコード署名前の社内QA専用品です。一般利用者へ配布しないでください。
          EOF
          fi

          test "$(find "$package_path" -maxdepth 1 -type f | wc -l)" -ge 3

      - name: Upload unsigned QA artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/qa-package/
          if-no-files-found: error
          retention-days: 7
