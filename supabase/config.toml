project_id = "candidate-crm"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:1420"
additional_redirect_urls = ["http://localhost:1420", "candidate-crm://auth/callback"]
jwt_expiry = 3600
enable_signup = false

[functions.generate-candidate-summary]
verify_jwt = true

[functions.extract-job-posting]
verify_jwt = true

[functions.get-ai-usage]
verify_jwt = true

[functions.invite-user]
verify_jwt = true
